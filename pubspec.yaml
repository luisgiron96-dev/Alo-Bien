name: alo_bien_app
description: App móvil oficial de ALO BIEN (acceso a alobienplataforma.com + notificaciones push).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  file_picker: ^13.4.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/